<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="planetGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="antennaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#planetGrad)"/>
  <!-- Planet ring -->
  <ellipse cx="32" cy="34" rx="26" ry="8" stroke="#FBBF24" stroke-width="3" stroke-dasharray="3 3" opacity="0.8"/>
  <!-- Robot Face (Tengo) -->
  <rect x="18" y="20" width="28" height="24" rx="8" fill="#FFFFFF"/>
  <!-- Eyes -->
  <circle cx="26" cy="30" r="3.5" fill="#3B82F6"/>
  <circle cx="38" cy="30" r="3.5" fill="#3B82F6"/>
  <circle cx="27" cy="29" r="1.2" fill="#FFFFFF"/>
  <circle cx="39" cy="29" r="1.2" fill="#FFFFFF"/>
  <!-- Smile -->
  <path d="M27 37 Q32 41 37 37" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Blush -->
  <circle cx="22" cy="35" r="2" fill="#F472B6" opacity="0.6"/>
  <circle cx="42" cy="35" r="2" fill="#F472B6" opacity="0.6"/>
  <!-- Antenna -->
  <path d="M32 20 V12" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="10" r="3.5" fill="url(#antennaGrad)"/>
  <!-- Little X symbol on forehead -->
  <text x="32" y="24" font-family="system-ui, sans-serif" font-weight="900" font-size="7" fill="#8B5CF6" text-anchor="middle">x</text>
</svg>
